<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لوحة إدارة Number Bot</title>
  <link rel="stylesheet" href="/admin-assets/admin.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-head">
      <div><span class="eyebrow">CONTROL CENTER</span><h1>لوحة القيادة</h1><p>رؤية مباشرة للمتجر، المزودين والعمليات.</p></div>
      <span class="shield">◆</span>
    </header>
    <section id="message" class="message hidden"></section>
    <section id="metrics" class="metrics"></section>
    <nav class="tabs" id="tabs">
      <button data-view="overview" class="active">نظرة عامة</button>
      <button data-view="orders">الطلبات</button>
      <button data-view="providers">المزودون</button>
      <button data-view="users">المستخدمون</button>
      <button data-view="promotions">العروض</button>
      <button data-view="quality">الجودة</button>
      <button data-view="health">الصحة العميقة</button>
      <button data-view="copilot">مساعد الإدارة</button>
      <button data-view="audit">السجل</button>
    </nav>
    <section id="panel" class="panel"></section>
  </main>
  <script src="/admin-assets/admin.js"></script>
</body>
</html>
