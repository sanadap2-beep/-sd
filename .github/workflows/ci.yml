name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BOT_TOKEN: "123456:TEST_TOKEN_FOR_CI_1234567890"
      BOT_USERNAME: test_bot
      ADMIN_IDS: "1"
      ADMIN_NOTIFY_CHAT_ID: "-1001"
      DATABASE_URL: sqlite+aiosqlite:////tmp/ci-bot.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (locked runtime + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q .
      - name: Ruff (syntax/runtime-breaking only; full F-lint is advisory)
        run: python -m ruff check . --select E9
      - name: Ruff full report (informational)
        continue-on-error: true
        run: python -m ruff check . --select E,F --statistics
      - name: Fast subset (money guards + limits)
        run: |
          python -m pytest tests/test_p0_money_guards.py tests/test_api_rate_limit.py -q
      - name: pip-audit (informational)
        continue-on-error: true
        run: |
          python -m pip_audit --desc on -r requirements.txt || true

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: botdb
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: ci_secret_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot -d botdb"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BOT_TOKEN: "123456:TEST_TOKEN_FOR_CI_1234567890"
      BOT_USERNAME: test_bot
      ADMIN_IDS: "1"
      ADMIN_NOTIFY_CHAT_ID: "-1001"
      DATABASE_URL: postgresql+asyncpg://bot:ci_secret_pw@localhost:5432/botdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Migrations from empty database
        run: |
          python -c "import asyncio; from database.seed import init_db; asyncio.run(init_db())"
      - name: Money guards on PostgreSQL
        run: |
          python -m pytest tests/test_p0_money_guards.py -q
