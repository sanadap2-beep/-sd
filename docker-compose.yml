services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: botdb
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d botdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:${POSTGRES_PASSWORD:-change_me}@postgres:5432/botdb
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8080
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:${POSTGRES_PASSWORD:-change_me}@postgres:5432/botdb
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  # جسر واتساب (قسم 📱 واتساب) — يعمل بجانب البوت الثاني.
  # هنا موصول بوضع «تجريبي» ليختبر أحدهما العقد كاملاً قبل كتابة الـ adapter:
  #   docker compose --profile wa-bridge up -d wa-bridge
  # ملاحظة أمنية: لا ports منشورة — الجسر reached فقط من شبكة Docker الداخلية،
  # لأنه يثق برأس X-TG-User-Id ومن يعرف السر يتصرف باسم أي مستخدم.
  wa-bridge:
    profiles: ["wa-bridge"]
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./wa_bridge:/app/wa_bridge:ro
    environment:
      BRIDGE_SECRET: ${WA_BRIDGE_SECRET:-}
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: "8090"
      WA_BRIDGE_ALLOW_PUBLIC: "1"          # المنفذ غير منشور — الوصول داخلي فقط
      WA_BRIDGE_ADAPTER: wa_bridge.adapter_example:ExampleWaAdapter
    command: sh -c "pip install --no-cache-dir -q -r wa_bridge/requirements.txt && uvicorn wa_bridge.bridge:app --host $${BRIDGE_HOST} --port $${BRIDGE_PORT}"
    restart: unless-stopped


volumes:
  redis_data:
  postgres_data:
